<h2>Планы / roadmap</h2>
<div class="card">
    <div id="plan-edit-banner" class="edit-banner" hidden>
        <span>✏️ Редактирование: <b id="plan-edit-name"></b></span>
        <button type="button" class="btn-outline" onclick="resetPlanForm()">Отменить правку</button>
    </div>
    <form id="form-plan" onsubmit="savePlan(event)">
        <input type="hidden" id="plan-id">
        <input type="text" id="plan-title" placeholder="Название этапа" maxlength="160" required>
        <textarea id="plan-desc" placeholder="Описание" rows="2" maxlength="600"></textarea>
        <div class="form-row-grid">
            <select id="plan-status">
                <option value="now">Сейчас</option>
                <option value="next">Дальше</option>
                <option value="later">Позже</option>
                <option value="done">Готово</option>
            </select>
            <input type="text" id="plan-eta" placeholder="Срок (Q4 2026)" maxlength="40">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-action" id="plan-save-btn">Добавить план</button>
            <button type="button" class="btn-outline" onclick="resetPlanForm()">Очистить</button>
        </div>
    </form>
</div>
<div id="plans-list"></div>
