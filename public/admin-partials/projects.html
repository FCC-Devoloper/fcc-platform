<h2>Проекты</h2>
            <div class="card">
                <form id="form-project" onsubmit="saveProject(event)">
                    <input type="hidden" id="project-id">
                    <input type="text" id="project-title" placeholder="Название проекта" required>
                    <textarea id="project-desc" placeholder="Описание..." rows="3"></textarea>
                    <input type="url" id="project-demo" placeholder="Внешнее демо / URL">
                    <select id="project-runtime">
                        <option value="">Автоопределение</option>
                        <option value="html">HTML / Web</option>
                        <option value="python">Python</option>
                    </select>
                    <input type="text" id="project-tech" placeholder="Технологии (Node.js, WebSockets)">
                    <input type="text" id="project-features" placeholder="Фишки через запятую">
                    <input type="url" id="project-image" placeholder="Картинка проекта (URL)">
                    <label>HTML-код демо</label>
                    <textarea id="project-html" rows="8" placeholder="Вставь HTML/CSS/JS-код, который клиент сможет запустить в браузере"></textarea>
                    <label>Python-код демо</label>
                    <textarea id="project-python" rows="8" placeholder="Вставь Python-код для запуска прямо в браузере"></textarea>
                    <button type="submit" class="btn-action">Сохранить проект</button>
                </form>
            </div>
            <div id="projects-list-container"></div>
