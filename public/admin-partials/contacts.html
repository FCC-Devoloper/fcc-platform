<h2>Контакты</h2>
            <div class="card">
                <label>Telegram</label>
                <input type="text" id="contact-tg" placeholder="@FCC_REPLACE_ME">
                <label>Email</label>
                <input type="text" id="contact-em" placeholder="hello@fcc.replace">
                <label>Телефон</label>
                <input type="text" id="contact-ph" placeholder="+000 000 00 00">
                <label>Режим</label>
                <input type="text" id="contact-hr" placeholder="24/7 диспетчерская">
                <button type="button" class="btn-action" onclick="saveContacts()">Сохранить контакты</button>
            </div>
