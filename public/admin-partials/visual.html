<h2>Visual Editor</h2>
<p class="muted">Нажмите на любой текст или кнопку в предпросмотре: подсвечены элементы, которые можно править. Изменения применяются сразу после «Сохранить».</p>
<div class="ve-devices">
    <button type="button" class="btn-outline on" data-w="100%" onclick="setVeDevice(this)">🖥 Компьютер</button>
    <button type="button" class="btn-outline" data-w="820px" onclick="setVeDevice(this)">📱 Планшет</button>
    <button type="button" class="btn-outline" data-w="390px" onclick="setVeDevice(this)">📱 Телефон</button>
    <button type="button" class="btn-outline" onclick="initVisualEditor()">⟳ Обновить превью</button>
    <span class="muted" id="ve-status">Загрузка превью…</span>
</div>
<div id="ve-toolbar" class="ve-toolbar" hidden>
    <div class="ve-title">Элемент: <code id="ve-key"></code> <span class="muted" id="ve-dirty"></span></div>
    <div class="ve-toolbar-grid">
        <label style="grid-column:1/-1">Текст <textarea id="ve-text" rows="2"></textarea></label>
        <label>Цвет текста <input id="ve-color" type="color" value="#ffffff"></label>
        <label>Размер (px) <input id="ve-size" type="number" min="8" max="120" placeholder="авто"></label>
        <label>Выравнивание
            <select id="ve-align">
                <option value="">По умолчанию</option>
                <option value="left">По левому краю</option>
                <option value="center">По центру</option>
                <option value="right">По правому краю</option>
            </select>
        </label>
        <label>Действие при нажатии
            <select id="ve-action">
                <option value="">Как на сайте</option>
                <option value="modal">Открыть форму заявки</option>
                <option value="chat">Открыть чат</option>
                <option value="scroll">Прокрутить к разделу</option>
                <option value="url">Перейти по ссылке</option>
            </select>
        </label>
        <label>Ссылка / id раздела <input id="ve-url" type="text" placeholder="https://… или services"></label>
    </div>
    <div class="form-actions">
        <button type="button" class="btn-action" onclick="saveElementMeta()">💾 Сохранить</button>
        <button type="button" class="btn-outline" onclick="previewElementMeta()">👁 Показать в превью</button>
        <button type="button" class="btn-outline" onclick="resetElementMeta()">↺ Вернуть исходный текст</button>
        <button type="button" class="btn-outline" onclick="closeVeToolbar()">Закрыть</button>
    </div>
</div>
<div class="visual-frame-wrap"><iframe id="visual-frame" class="visual-frame" title="FCC preview"></iframe></div>
