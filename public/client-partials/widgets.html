<!-- CHAT WIDGET & DRAWER -->
        <div id="chat-widget-btn" role="button" tabindex="0" onclick="toggleChatWindow()" aria-label="Открыть чат">
            <span class="chat-fab-ico" data-icon="message"></span>
            <span class="chat-fab-label">Чат</span>
            <span class="unread-badge" id="unread-count" style="display:none;">0</span>
        </div>

        <div id="chat-drawer" class="chat-drawer">
            <div class="chat-header">
                <div class="chat-title">
                    <span class="status-dot"></span>
                    <span id="chat-target-name">Бот-помощник FCC</span>
                </div>
                <button class="close-btn" type="button" onclick="toggleChatWindow()">✕</button>
            </div>
            <div class="chat-messages" id="chat-messages">
                <div class="message bot">
                    <div class="msg-text">Здравствуйте! Я автоматический ассистент FCC. Чем могу помочь?</div>
                </div>
            </div>
            <form class="chat-input-area" id="chat-form" onsubmit="sendChatMessage(event)">
                <input type="text" id="chat-input" placeholder="Введите сообщение..." required autocomplete="off">
                <button type="submit" aria-label="Отправить" data-icon="arrow"></button>
            </form>
        </div>
