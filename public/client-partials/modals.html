<!-- MODAL: ORDER -->
        <div id="order-modal" class="modal-overlay">
            <div class="modal-content">
                <button class="close-btn" type="button" onclick="closeOrderModal()">✕</button>
                <h3>Оформить заявку</h3>
                <form id="order-form" onsubmit="submitOrder(event)">
                    <input type="text" id="order-title" placeholder="Название проекта / задачи" required>
                    <select id="order-category">
                        <option value="web">Веб-разработка</option>
                        <option value="bot">Telegram-бот / AI</option>
                        <option value="3d">3D & WebGL</option>
                        <option value="python">Python обучение</option>
                        <option value="other">Другое</option>
                    </select>
                    <textarea id="order-desc" placeholder="Описание" rows="3"></textarea>
                    <input type="text" id="order-contact" placeholder="Контакт (Telegram / телефон)" required>
                    <button type="submit" class="btn-primary">Отправить заявку</button>
                </form>
            </div>
        </div>

        <!-- AUTH: redirect to dedicated pages -->
        <div id="auth-modal" class="modal-overlay">
            <div class="modal-content auth-modal-box" style="max-width:380px;text-align:center;">
                <button class="close-btn" type="button" onclick="closeAuthModal()">✕</button>
                <h3 style="margin:8px 0 18px;">Войти в аккаунт</h3>
                <a class="auth-provider-btn" href="/login.html" style="display:flex;text-decoration:none;margin:8px 0;">G · Войти через Google / Email</a>
                <a class="auth-provider-btn" href="/register.html" style="display:flex;text-decoration:none;margin:8px 0;">Создать аккаунт</a>
            </div>
        </div>

        <div id="python-modal" class="modal-overlay">
            <div class="modal-content">
                <button class="close-btn" type="button" onclick="closePythonModal()">✕</button>
                <h3>Python Learning</h3>
                <p class="muted">Начать трек обучения Python в FCC</p>
                <button type="button" class="btn-primary" onclick="startPythonTrack()">Начать</button>
            </div>
        </div>
