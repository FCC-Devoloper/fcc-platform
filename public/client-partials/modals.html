<!-- MODAL: ORDER -->
        <div id="order-modal" class="modal-overlay">
            <div class="modal-content">
                <button class="close-btn" type="button" onclick="closeOrderModal()">✕</button>
                <h3>Оформить заявку</h3>
                <form id="order-form" onsubmit="submitOrder(event)">
                    <input type="text" id="order-title" placeholder="Название проекта / задачи" required>
                    <select id="order-category">
                        <option value="web">Веб-разработка</option>
                        <option value="bot">Telegram-бот / AI</option>
                        <option value="3d">3D & WebGL</option>
                        <option value="python">Python обучение</option>
                        <option value="other">Другое</option>
                    </select>
                    <textarea id="order-desc" placeholder="Краткое описание требований..." rows="4" required></textarea>
                    <input type="text" id="order-contact" placeholder="Ваш Telegram или Email" required>
                    <button type="submit" class="btn-primary" style="width:100%;">Отправить тикет</button>
                </form>
            </div>
        </div>

        <!-- MODAL: AUTHENTICATION -->
        <div id="auth-modal" class="modal-overlay">
            <div class="modal-content">
                <button class="close-btn" type="button" onclick="closeAuthModal()">✕</button>
                
                <div class="auth-tabs" style="display:flex; gap:8px; margin-bottom:16px;">
                    <button type="button" class="btn-outline auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Вход</button>
                    <button type="button" class="btn-outline auth-tab" id="tab-register" onclick="switchAuthTab('register')">Регистрация</button>
                </div>

                <h3 id="auth-title">Вход в аккаунт</h3>

                <form id="auth-form" onsubmit="handleAuthSubmit(event)">
                    <input type="text" id="auth-username" placeholder="Логин" required maxlength="32" autocomplete="username">
                    <input type="email" id="auth-email" placeholder="Email (необязательно)" style="display:none;" autocomplete="email">
                    <input type="password" id="auth-password" placeholder="Пароль" required minlength="4" autocomplete="current-password">
                    <button type="submit" class="btn-primary" style="width:100%; margin-top:12px;" id="auth-submit-btn">Войти</button>
                </form>

                <p id="auth-error" style="color:#ff6b6b; font-size:13px; margin-top:10px; display:none;"></p>
            </div>
        </div>

        <!-- MODAL: PYTHON -->
        <div id="python-modal" class="modal-overlay">
            <div class="modal-content python-modal">
                <button class="close-btn" type="button" onclick="closePythonModal()">✕</button>
                <div class="python-kicker">PYTHON LEARNING</div>
                <h3>Хочу учить Python</h3>
                <p class="python-lead">Изучай Python с нуля:</p>
                <ul class="python-list">
                    <li>базовый синтаксис</li>
                    <li>функции</li>
                    <li>ООП</li>
                    <li>работа с файлами</li>
                    <li>API</li>
                    <li>Telegram-боты</li>
                    <li>реальные проекты</li>
                </ul>
                <div class="python-actions">
                    <button class="btn-primary" type="button" onclick="startPythonTrack()">Начать обучение</button>
                    <button class="btn-outline" type="button" onclick="closePythonModal(); toggleChatWindow();">Связаться с FCC</button>
                </div>
            </div>
        </div>

    </div>
