<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <title>Проекты | Fast Coding Crew</title>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&family=Rajdhani:wght@500;600;700&family=Russo+One&family=Unbounded:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link id="site-theme" rel="stylesheet" href="css/theme-original.css">
    <link rel="stylesheet" href="css/fonts.css">
</head>
<body class="inner-page">
    <header id="navbar">
        <a class="logo" href="index.html">FCC<span class="dot">.</span></a>
        <button class="nav-toggle" id="nav-toggle" type="button">☰</button>
        <nav id="site-nav">
                <a href="/">Главная</a>
                <a href="/#about">О нас</a>
                <a href="/#services">Услуги</a>
                <a id="learning-center-nav" href="/learning-center" hidden>Learning Center</a>
                <a href="/projects.html">Проекты</a>
                <a href="/news.html">Новости</a>
                <a href="/plans.html">Планы</a>
                <a href="/contacts.html">Контакты</a>
            </nav>
        <div class="header-right">
            <button class="btn-primary" type="button" onclick="openOrderModal()">Оставить заявку</button>
            <div class="theme-switcher">
                <button class="btn-outline" type="button" id="theme-toggle">Тема</button>
                <div class="theme-menu" id="theme-menu">
                    <button type="button" data-theme="theme-original.css">FCC Original</button>
                    <button type="button" data-theme="theme-cyber.css">Cyber</button>
                    <button type="button" data-theme="theme-space.css">Space</button>
                    <button type="button" data-theme="theme-glass.css">Glass</button>
                </div>
            </div>
        </div>
    </header>
    <main id="main-content" class="page-main">
        <section class="section">
            <div class="section-header">
                <h2>Проекты FCC</h2>
                <p>Наши проекты, технологии и интерактивные демо</p>
            </div>
            <div class="projects-grid" id="page-projects"></div>
        </section>
    </main>
    <div id="promo-widget-btn" class="promo-widget-btn" onclick="togglePromoPopup()" aria-label="Открыть акцию" style="display:none;">
        <span class="promo-widget-percent" id="promo-widget-percent">%</span>
        <span class="promo-widget-label">Акция</span>
    </div>
    <div id="promo-popup" class="promo-popup" aria-hidden="true">
        <div class="promo-popup-card">
            <button class="close-btn promo-popup-close" type="button" onclick="closePromoPopup()">✕</button>
            <div class="promo-popup-kicker">АКТУАЛЬНОЕ ПРЕДЛОЖЕНИЕ</div>
            <div class="promo-popup-discount" id="promo-popup-discount">-0%</div>
            <h3 id="promo-popup-title">Акция</h3>
            <p class="promo-popup-target" id="promo-popup-target"></p>
            <p id="promo-popup-description"></p>
            <a id="promo-popup-action" class="btn-primary promo-popup-action" href="#" style="display:none;">Подробнее</a>
        </div>
    </div>
    <div id="chat-widget-btn" onclick="toggleChatWindow()"><span class="chat-fab-ico">💬</span><span class="chat-fab-label">Чат</span><span class="unread-badge" id="unread-count" style="display:none;">0</span></div>
    <div id="chat-drawer" class="chat-drawer">
        <div class="chat-header"><div class="chat-title"><span class="status-dot"></span><span id="chat-target-name">FCC Chat</span></div><button class="close-btn" type="button" onclick="toggleChatWindow()">✕</button></div>
        <div class="chat-messages" id="chat-messages"></div>
        <form class="chat-input-area" onsubmit="sendChatMessage(event)"><input id="chat-input" placeholder="Сообщение..." required><button type="submit">➔</button></form>
    </div>
    <div id="order-modal" class="modal-overlay"><div class="modal-content"><button class="close-btn" type="button" onclick="closeOrderModal()">✕</button><h3>Заявка</h3><form id="order-form" onsubmit="submitOrder(event)"><input id="order-title" required placeholder="Название"><select id="order-category"><option value="web">Веб</option><option value="bot">Бот</option><option value="python">Python</option></select><textarea id="order-desc" rows="3" required></textarea><input id="order-contact" required placeholder="Telegram / Email"><button class="btn-primary" type="submit">Отправить</button></form></div></div>
    <div id="auth-modal" class="modal-overlay"><div class="modal-content"><button class="close-btn" type="button" onclick="closeAuthModal()">✕</button><h3>Вход</h3><form id="auth-form" onsubmit="handleAuth(event)"><input id="auth-username" required placeholder="Логин"><input id="auth-password" type="password" required placeholder="Пароль"><button class="btn-primary" type="submit">Войти</button></form></div></div>
    <div id="python-modal" class="modal-overlay"><div class="modal-content"><button class="close-btn" type="button" onclick="closePythonModal()">✕</button><h3>Python</h3></div></div>
    <script src="js/site-render.js"></script>
    <script src="js/client/00-globals.js"></script>
    <script src="js/client/toast.js"></script>
    <script src="js/client/auth.js"></script>
    <script src="js/client/orders.js"></script>
    <script src="js/client/icons.js"></script>
    <script src="js/client/backgrounds.js"></script>
    <script src="js/client/a11y.js"></script>
    <script src="js/client/promos.js"></script>
    <script src="js/client/cms.js"></script>
    <script src="js/fx.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/theme-manager.js"></script>
    <script>document.addEventListener('DOMContentLoaded', () => { FCCRender.renderProjects('#page-projects', { filters: true }); });</script>
</body>
</html>
