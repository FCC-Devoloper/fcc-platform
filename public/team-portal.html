<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FCC Team Portal</title>
<link rel="stylesheet" href="/css/admin.css">
<style>
body{min-height:100vh;margin:0;display:flex;align-items:center;justify-content:center;background:#07080d;color:#e8eaef;font-family:system-ui,sans-serif}
.box{width:min(420px,94vw);background:#12141c;border:1px solid #2a2f3a;border-radius:16px;padding:28px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
h1{margin:0 0 6px;font-size:1.25rem;color:#00ff9d}
.muted{color:#8a93a3;font-size:13px;margin:0 0 16px}
input,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #333;background:#0c0e14;color:#eee}
button{background:#00ff9d;color:#04110a;border:0;font-weight:700;cursor:pointer}
button.secondary{background:#1c2230;color:#dde;border:1px solid #333}
.err{color:#ff6b5c;font-size:13px;display:none;margin-top:8px}
.hidden{display:none!important}
.secret-zone{margin-top:24px;padding-top:12px;border-top:1px dashed #333;opacity:.35}
.secret-zone:focus-within,.secret-zone.hot{opacity:1}
.hint{font-size:11px;color:#556;margin-top:16px;text-align:center}
</style>
</head>
<body>
<div class="box">
  <h1>FCC Team Portal</h1>
  <p class="muted">Закрытый вход для команды. Клиенты сюда не пускаются.</p>

  <div id="step-key">
    <input type="password" id="access-key" placeholder="Индивидуальный ключ доступа" autocomplete="off">
    <button type="button" id="btn-key">Войти по ключу</button>
  </div>

  <div id="step-dev" class="hidden">
    <p class="muted">Базовый доступ (~15%). Заявки и сообщения — в <a href="/dev.html" style="color:#00ff9d">/dev.html</a></p>
    <p>Вы: <strong id="dev-user-label"></strong></p>
    <button type="button" class="secondary" onclick="location.href='/dev.html'">Открыть панель разработчика</button>

    <!-- Secret escalation: triple-click title or focus secret zone -->
    <div class="secret-zone" id="secret-zone" title="">
      <p class="muted" style="font-size:11px">Служебная зона</p>
      <div id="esc-form" class="hidden">
        <input type="text" id="adm-user" placeholder="Логин главного админа" autocomplete="username">
        <input type="password" id="adm-pass" placeholder="Пароль" autocomplete="current-password">
        <button type="button" id="btn-esc">Запросить OTP на email</button>
      </div>
    </div>
  </div>

  <div id="step-otp" class="hidden">
    <p class="muted">Код отправлен на <span id="email-hint"></span></p>
    <input type="text" id="otp-code" placeholder="6-значный код" inputmode="numeric" maxlength="8">
    <button type="button" id="btn-otp">Подтвердить и войти как Admin</button>
    <p id="dev-code" class="muted" style="font-size:12px"></p>
  </div>

  <div id="err" class="err"></div>
  <p class="hint">Admin URL защищён на сервере. Клиентский сайт не выдаёт admin-сессию.</p>
</div>
<script>
let pendingToken = null;
let clicks = 0;
function showErr(m){const e=document.getElementById('err');e.style.display='block';e.textContent=m||'';}
function hideErr(){document.getElementById('err').style.display='none';}

document.getElementById('btn-key').onclick = async () => {
  hideErr();
  const access_key = document.getElementById('access-key').value.trim();
  const res = await fetch('/api/auth/team-key',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access_key})});
  const data = await res.json();
  if(!res.ok){showErr(data.error||'Ошибка');return;}
  localStorage.setItem('fcc_team_token', data.token);
  localStorage.setItem('fcc_dev_token', data.token); // allow /dev limited
  document.getElementById('step-key').classList.add('hidden');
  document.getElementById('step-dev').classList.remove('hidden');
  document.getElementById('dev-user-label').textContent = data.username + ' · level ' + data.level + '%';
  if (data.canEscalate) {
    document.getElementById('secret-zone').classList.add('hot');
  }
};

// secret: 5 clicks on h1 opens escalate form
document.querySelector('h1').addEventListener('click', () => {
  clicks++;
  if (clicks >= 5) {
    document.getElementById('esc-form').classList.remove('hidden');
    document.getElementById('secret-zone').classList.add('hot');
  }
});

document.getElementById('btn-esc').onclick = async () => {
  hideErr();
  const username = document.getElementById('adm-user').value.trim();
  const password = document.getElementById('adm-pass').value;
  const res = await fetch('/api/auth/admin-escalate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
  const data = await res.json();
  if(!res.ok){showErr(data.error||'Ошибка');return;}
  if (data.direct) {
    localStorage.setItem('fcc_admin_token', data.token);
    document.cookie = 'fcc_admin_token=' + encodeURIComponent(data.token) + '; path=/; SameSite=Lax; max-age=' + (7*24*3600);
    location.href = '/admin.html';
    return;
  }
  pendingToken = data.pendingToken;
  document.getElementById('step-dev').classList.add('hidden');
  document.getElementById('step-otp').classList.remove('hidden');
  document.getElementById('email-hint').textContent = data.emailHint || 'email';
  if (data.devCode) document.getElementById('dev-code').textContent = 'Dev OTP (SMTP не настроен): ' + data.devCode;
};

document.getElementById('btn-otp').onclick = async () => {
  hideErr();
  const code = document.getElementById('otp-code').value.trim();
  const res = await fetch('/api/auth/admin-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pendingToken, code})});
  const data = await res.json();
  if(!res.ok){showErr(data.error||'Ошибка');return;}
  localStorage.setItem('fcc_admin_token', data.token);
  document.cookie = 'fcc_admin_token=' + encodeURIComponent(data.token) + '; path=/; SameSite=Lax; max-age=' + (7*24*3600);
  location.href = '/admin.html';
};
</script>
</body>
</html>
